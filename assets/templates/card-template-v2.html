<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root{--sans:"Pretendard",-apple-system,system-ui,sans-serif;--ink:#453F4E;--sub:#8B8397;--panel:#fff;--bg1:#EEEBF7;--bg2:#E7EEF7;--accent:#7FA8D4;--accent2:#A9D5C9;--warn:#EFA36B}
    body.season-spring{--bg1:#FBEDF2;--bg2:#F3E8F0;--accent:#F3A9C0;--accent2:#E9C4D8}
    body.season-summer{--bg1:#EAF3FB;--bg2:#E4F0F7;--accent:#7FBEE8;--accent2:#F4D06A;--warn:#F09772}
    body.season-jangma{--bg1:#EEEBF7;--bg2:#E7EEF7;--accent:#7FA8D4;--accent2:#A9D5C9}
    body.season-autumn{--bg1:#F6EFE4;--bg2:#F1E7D8;--accent:#E5A46A;--accent2:#CB9A78}
    body.season-winter{--bg1:#EEF1F5;--bg2:#E7ECF2;--accent:#9DB6D4;--accent2:#C9CFD8}
    *{margin:0;padding:0;box-sizing:border-box} body{font-family:var(--sans);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;line-break:strict} #stage{display:flex;flex-direction:column;gap:40px}.card{width:1080px;height:1350px;position:relative;overflow:hidden;padding:92px 86px;background:linear-gradient(155deg,var(--bg1),var(--bg2))}
    .rain{display:none;position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:repeating-linear-gradient(20deg,transparent 0 46px,rgba(127,168,212,.22) 46px 48px);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 55%);mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 55%)} body.season-jangma .rain{display:block}.rain.soft{opacity:.20}
    .c-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.badge{font-size:28px;font-weight:800;color:#fff;background:var(--accent);padding:12px 26px;border-radius:999px}.handle{font-size:28px;font-weight:700;color:var(--sub)}
    .cover-mid{margin:128px 0 0 28px;position:relative;z-index:2;max-width:780px}.stat-hero{display:flex;align-items:baseline;gap:18px;margin-bottom:18px}.stat-num{font-size:128px;font-weight:900;color:var(--accent);letter-spacing:-.04em;line-height:1}.stat-arrow{font-size:80px;font-weight:900;color:var(--accent2);line-height:1}.hook{font-size:90px;font-weight:850;line-height:1.19;letter-spacing:-.045em}.cover-sub{font-size:35px;color:var(--sub);font-weight:650;margin-top:34px}.cover-orbit{position:absolute;right:-120px;bottom:110px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.18) 40%,transparent 70%);border:2px solid rgba(255,255,255,.42)}.cover-orbit:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:var(--accent2);left:4px;top:90px;opacity:.6}
    .char{position:absolute;z-index:3}.char-cover{width:390px;right:58px;bottom:72px;filter:drop-shadow(0 14px 22px rgba(80,90,140,.18))}.char-sm{width:190px;right:58px;bottom:82px;filter:drop-shadow(0 12px 18px rgba(80,90,140,.16))}.char-left{left:58px;right:auto}
    .panel{background:var(--panel);border-radius:52px;padding:78px 74px;position:relative;box-shadow:0 18px 44px rgba(80,90,140,.10);min-height:76%;z-index:1}.panel.center{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:68%}.num{font-size:58px;font-weight:900;color:var(--accent)}.eyebrow{font-size:36px;font-weight:800;color:var(--accent);margin-bottom:22px;display:flex;align-items:center}.c-title{font-size:70px;font-weight:850;line-height:1.2;letter-spacing:-.035em;margin:12px 0 32px}.c-body{font-size:43px;font-weight:520;line-height:1.52;color:#5c5666}.todo{list-style:none;margin-top:12px}.todo li{font-size:46px;font-weight:650;line-height:1.42;padding:20px 0 20px 68px;position:relative}.todo li:before{content:"✓";position:absolute;left:0;color:#fff;background:var(--accent2);width:48px;height:48px;border-radius:50%;text-align:center;line-height:48px;font-size:31px;font-weight:900}.mini-check{display:inline-flex;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:27px;margin-right:14px;flex:none}
    .disc-title{font-size:58px;font-weight:850;margin-bottom:26px}.disc{font-size:42px;line-height:1.55;color:#5c5666}.disc-note{font-size:32px;color:var(--sub);margin-top:42px}.handle-btm{position:absolute;left:0;right:0;bottom:58px;text-align:center}.mini-paw{font-size:42px;opacity:.45;margin-bottom:16px}
    /* 레이아웃 2: 비교·대조용 좌우 분할 */
    .split-layout{height:1010px;background:#fff;border-radius:52px;overflow:hidden;display:grid;grid-template-columns:36% 64%;box-shadow:0 18px 44px rgba(80,90,140,.10);position:relative;z-index:1}.split-side{background:linear-gradient(160deg,var(--accent),var(--accent2));padding:74px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}.split-side .num{color:#fff;font-size:72px}.split-side .viz{margin-top:36px}.split-side .viz-q-bare{color:#fff}.split-side .pill-main{background:#fff;color:var(--accent)}.split-side .pill-sub{background:rgba(255,255,255,.18);border-color:#fff;color:#fff}.split-side .branch-line,.split-side .branch-row:before{background:#fff}.split-copy{padding:98px 54px 70px}.split-copy .c-title{font-size:64px}.split-copy .c-body{font-size:40px}.split-char{width:165px;bottom:44px;right:28px}
    /* 레이아웃 3: 이야기·전환점용 에디토리얼 */
    .story-layout{height:1030px;position:relative;z-index:1;padding:62px 56px;border-radius:52px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.62));border:2px solid rgba(255,255,255,.65)}.story-layout:before{content:"";position:absolute;right:-150px;top:-180px;width:500px;height:500px;border-radius:50%;background:var(--accent2);opacity:.38}.story-layout .num{position:relative;z-index:1}.story-layout .c-title{position:relative;z-index:1;max-width:710px;font-size:74px}.story-body{position:relative;z-index:1;background:#fff;border-radius:32px;padding:34px 38px;max-width:730px;box-shadow:0 10px 28px rgba(80,90,140,.08)}.story-body .c-body{font-size:40px}.story-layout .viz{position:relative;z-index:1;margin-top:38px;max-width:680px}.story-char{width:200px;right:38px;bottom:44px}
    /* 시각화 */
    .viz{width:100%;margin-top:34px;display:flex;justify-content:center}.viz-q-bare{font-size:200px;font-weight:900;color:var(--accent);line-height:1}.viz-hub{display:flex;flex-direction:column;align-items:center;width:100%}.pill-main{background:var(--accent);color:#fff;font-weight:800;font-size:32px;padding:15px 32px;border-radius:999px}.branch-line{width:3px;height:24px;background:var(--accent2)}.branch-row{display:flex;gap:28px;position:relative;padding-top:14px}.branch-row:before{content:"";position:absolute;top:0;left:14%;right:14%;height:3px;background:var(--accent2)}.pill-sub{background:#fff;border:3px solid var(--accent2);color:var(--ink);font-weight:700;font-size:28px;padding:13px 24px;border-radius:999px}.viz-bar{display:flex;align-items:flex-end;gap:130px;height:210px;padding:72px 10px 0}.bar{width:72px;background:var(--accent2);border-radius:14px 14px 0 0;position:relative}.bar.hi{background:var(--accent)}.bar .lbl{position:absolute;top:-68px;left:50%;transform:translateX(-50%);font-size:26px;line-height:1.25;font-weight:800;color:var(--accent);white-space:pre;text-align:center;min-width:190px}.bar:not(.hi) .lbl{color:var(--sub)}.viz-timeline{display:flex;align-items:center;justify-content:space-between;width:100%;padding:20px 4px 6px;position:relative}.viz-timeline:before{content:"";position:absolute;left:8%;right:8%;top:32px;height:3px;background:var(--accent2)}.pt{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}.dot{width:22px;height:22px;border-radius:50%;background:var(--accent2);border:5px solid var(--bg1)}.pt.now .dot{background:var(--accent);width:30px;height:30px}.val{font-size:27px;font-weight:800;color:var(--sub);white-space:nowrap}.pt.now .val{color:var(--accent);font-size:33px}.viz-icon-row{display:flex;align-items:center;justify-content:center;gap:26px;width:100%}.icon-doc{width:108px;height:128px;background:#fff;border:5px solid var(--accent);border-radius:16px;position:relative;flex:none}.icon-doc .ln{position:absolute;left:20px;right:20px;height:7px;background:var(--accent2);border-radius:4px}.icon-doc.small{width:76px;height:92px}.icon-doc.small .ln{height:5px;left:14px;right:14px}.icon-piggy{width:130px;height:100px;background:var(--accent2);border-radius:50% 50% 46% 46%/62% 62% 38% 38%;position:relative;flex:none;margin-top:16px}.icon-piggy:before{content:"";position:absolute;top:-20px;right:20px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:24px solid var(--accent2)}.slot{position:absolute;top:16px;left:50%;transform:translateX(-50%) rotate(6deg);width:34px;height:6px;background:var(--ink);opacity:.28;border-radius:3px}.legs{position:absolute;bottom:-14px;left:20px;right:20px;display:flex;justify-content:space-between}.legs span{width:14px;height:16px;background:var(--accent2);border-radius:0 0 6px 6px}.icon-piggy.small{width:92px;height:72px;margin-top:10px}.icon-piggy.small .legs span{width:10px;height:11px}.badge-arrow{width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;flex:none}.pair-vs{font-size:40px;font-weight:800;color:var(--sub)}
    .viz-flow{display:flex;align-items:center;justify-content:center;gap:16px}.flow-node{padding:18px 22px;border-radius:22px;background:#fff;border:3px solid var(--accent2);font-size:29px;font-weight:800}.flow-arrow{font-size:44px;color:var(--accent);font-weight:900}.viz-alert{display:flex;flex-direction:column;align-items:center;gap:14px}.alert-mark{width:100px;height:88px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--warn);color:#fff;font-size:52px;font-weight:900;display:flex;align-items:center;justify-content:center;padding-top:18px}.alert-text{font-size:30px;font-weight:800;color:var(--warn)}
  </style>
</head>
<body>
  <div id="stage"></div>
  <script>
    function esc(s){s=(s||'');return s.split('·').join('⁠·⁠')}
    var RIGHT_FACING_POSES=['cat-explain','cat-happy','cat-default','cat-worried','cat-thinking','cat-sit'];
    function charImg(name,cls){if(!name)return '';var pos=RIGHT_FACING_POSES.indexOf(name)>-1?' char-left':'';return '<img class="char '+cls+pos+'" src="../character/'+name+'.png">'}
    function rain(soft){return '<div class="rain'+(soft?' soft':'')+'"></div>'}
    function vizHTML(v){if(!v||!v.type)return '';if(v.type==='question')return '<div class="viz"><span class="viz-q-bare">?</span></div>';if(v.type==='hub')return '<div class="viz viz-hub"><span class="pill-main">'+esc(v.main)+'</span><div class="branch-line"></div><div class="branch-row"><span class="pill-sub">'+esc(v.a)+'</span><span class="pill-sub">'+esc(v.b)+'</span></div></div>';if(v.type==='bars'){var m=1;(v.items||[]).forEach(function(i){m=Math.max(m,i.h)});return '<div class="viz"><div class="viz-bar">'+(v.items||[]).map(function(i){var h=Math.round(i.h/m*140)+28;return '<div class="bar'+(i.hi?' hi':'')+'" style="height:'+h+'px"><span class="lbl">'+esc(i.label)+'</span></div>'}).join('')+'</div></div>'}if(v.type==='timeline')return '<div class="viz"><div class="viz-timeline">'+(v.points||[]).map(function(p){return '<div class="pt'+(p.now?' now':'')+'"><span class="dot"></span><span class="val">'+esc(p.label)+'</span></div>'}).join('')+'</div></div>';if(v.type==='doc-up')return '<div class="viz"><div class="viz-icon-row"><div class="icon-doc"><div class="ln" style="top:36px"></div><div class="ln" style="top:58px"></div><div class="ln" style="top:80px;right:50px"></div></div><span class="badge-arrow">↑</span></div></div>';if(v.type==='piggy-up')return '<div class="viz"><div class="viz-icon-row"><div class="icon-piggy"><span class="slot"></span><span class="legs"><span></span><span></span></span></div><span class="badge-arrow" style="background:var(--accent2)">↑</span></div></div>';if(v.type==='pair')return '<div class="viz"><div class="viz-icon-row"><div class="icon-doc small"><div class="ln" style="top:24px"></div><div class="ln" style="top:40px"></div></div><span class="pair-vs">&amp;</span><div class="icon-piggy small"><span class="slot"></span><span class="legs"><span></span><span></span></span></div></div></div>';if(v.type==='flow')return '<div class="viz"><div class="viz-flow"><span class="flow-node">'+esc(v.a)+'</span><span class="flow-arrow">→</span><span class="flow-node">'+esc(v.b)+'</span></div></div>';if(v.type==='alert')return '<div class="viz"><div class="viz-alert"><span class="alert-mark">!</span><span class="alert-text">'+esc(v.label||'주의')+'</span></div></div>';return ''}
    function standardText(c){return (c.num?'<div class="num">'+esc(c.num)+'</div>':'')+(c.eyebrow?'<div class="eyebrow">'+esc(c.eyebrow)+'</div>':'')+'<div class="c-title">'+esc(c.title)+'</div><div class="c-body">'+esc(c.body)+'</div>'}
    function generic(c){var layout=c.layout||'panel',v=vizHTML(c.visual);if(layout==='split')return rain(true)+'<div class="split-layout"><div class="split-side">'+(c.num?'<div class="num">'+esc(c.num)+'</div>':'')+v+'</div><div class="split-copy"><div class="c-title">'+esc(c.title)+'</div><div class="c-body">'+esc(c.body)+'</div></div></div>'+charImg(c.char,'char-sm split-char');if(layout==='story')return rain(true)+'<div class="story-layout">'+(c.num?'<div class="num">'+esc(c.num)+'</div>':'')+'<div class="c-title">'+esc(c.title)+'</div><div class="story-body"><div class="c-body">'+esc(c.body)+'</div></div>'+v+'</div>'+charImg(c.char,'char-sm story-char');return rain(true)+'<div class="panel">'+standardText(c)+v+'</div>'+charImg(c.char,'char-sm')}
    function cardHTML(c){if(c.type==='cover')return rain(false)+'<div class="cover-orbit"></div><div class="c-top"><span class="badge">'+esc(c.badge)+'</span><span class="handle">'+esc(c.handle)+'</span></div><div class="cover-mid">'+(c.stat?'<div class="stat-hero"><span class="stat-num">'+esc(c.stat)+'</span><span class="stat-arrow">'+esc(c.statArrow||'↑')+'</span></div>':'')+'<div class="hook">'+esc(c.hook)+'</div>'+(c.sub?'<div class="cover-sub">'+esc(c.sub)+'</div>':'')+'</div>'+charImg(c.char,'char-cover');if(c.type==='action'){var it=(c.items||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join('');return rain(true)+'<div class="panel"><div class="eyebrow"><span class="mini-check">✓</span>'+esc(c.eyebrow||'오늘 할 수 있는 것')+'</div><ul class="todo">'+it+'</ul></div>'+charImg(c.char,'char-sm')}if(c.type==='disclaimer')return rain(true)+'<div class="panel center"><div class="mini-paw">🐾</div><div class="disc-title">'+esc(c.brand)+'</div><div class="disc">'+esc(c.text)+'</div>'+(c.note?'<div class="disc-note">'+esc(c.note)+'</div>':'')+'</div><div class="handle handle-btm">'+esc(c.handle)+'</div>';return generic(c)}
    window.buildCards=function(data){document.body.className='season-'+(data.season||'jangma');var stage=document.getElementById('stage');stage.innerHTML='';(data.cards||[]).forEach(function(c){if(!c.handle&&data.handle)c.handle=data.handle;var d=document.createElement('div');d.className='card';d.innerHTML=cardHTML(c);stage.appendChild(d)})}
  </script>
</body>
</html>
