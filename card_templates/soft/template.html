<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- soft: 흰색→파스텔 부드러운 배경 + 가운데 누끼 사진 + 위 굵은 검은 제목(속지는 ❶ 번호) + 아래 검은 테두리 흰 박스.
     누끼는 배경 제거 대신 "흰 배경 위 피사체" 사진을 곱하기(multiply)로 얹어 흰 부분이 배경에 녹게 한다
     (images.py의 soft 스타일이 흰 배경으로 요청). 배경 색은 덱 제목으로 4가지 중 하나. (레퍼런스: MSMG 3번·눈뜨니 로코 여주) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .slide { color: #111; font-family: "Pretendard", sans-serif; }
  .slide .bg, .slide .shade { display: none; }
  .deco .wall { inset: 0; }
  .deco .cut { left: 50%; transform: translateX(-50%); top: 400px; width: 760px; height: 600px; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.12) contrast(1.12);
               -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }
  .deco .say { background: #fff; border: 3px solid #111; padding: 14px 26px; font-size: 32px; font-weight: 600; left: 140px; top: 470px; }
  .deco .say::after { content: ""; position: absolute; right: 30px; bottom: -22px; border: 11px solid transparent; border-top: 12px solid #111; border-right-width: 2px; }

  .content { left: 70px; right: 70px; top: 0; bottom: 0; }
  .num { display: inline-grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; background: #111; color: #fff; font-size: 54px; font-weight: 800; margin: 110px 0 26px; }
  .title { margin-top: 120px; font-size: 104px; font-weight: 800; line-height: 1.22; letter-spacing: -.045em; }
  .num + .title, .num + .value { margin-top: 0; }
  h2.title { font-size: 92px; }
  .box { position: absolute; left: 0; right: 0; bottom: 150px; background: #fff; border: 3px solid #111; padding: 34px 40px; font-size: 38px; line-height: 1.6; font-weight: 500; }
  .box p + p, .box li + li { margin-top: 6px; }
  .box li::before { content: "→ "; font-weight: 800; }
  .box .src { color: #666; font-size: 32px; }
  .value { margin-top: 120px; font-size: 240px; font-weight: 900; letter-spacing: -.05em; line-height: 1; }
  .label { margin-top: 26px; font-size: 56px; font-weight: 800; line-height: 1.3; }
  .cmp { position: absolute; left: 0; right: 0; top: 520px; display: flex; gap: 24px; }
  .cmp div { flex: 1; background: #fff; border: 3px solid #111; padding: 34px 36px; }
  .cmp small { display: block; font-size: 38px; font-weight: 700; color: #555; }
  .cmp b { display: block; margin-top: 6px; font-size: 104px; font-weight: 900; letter-spacing: -.04em; }
  .k-list .box, .k-compare .box { bottom: 150px; }
  .k-list .box { font-size: 44px; font-weight: 600; }

  .foot { left: 40px; right: 40px; bottom: 44px; font-size: 26px; font-weight: 500; }
  .foot .mark { position: absolute; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
</style></head>
<body><div id="deck"></div>
<script>
(() => {
  // 흰색에서 파스텔로 번지는 배경(레퍼런스의 하늘색·라임 계열 + 분홍·민트)
  const WALLS = ["#9CCBFF", "#E4F54F", "#FFC2D9", "#A8F0D1"];
  const hash = (s) => [...String(s || "")].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7);
  const CIRCLED = "❶❷❸❹❺❻❼❽❾";
  const lines = (ctx, arr) => arr.filter(Boolean).map((s) => `<p>${ctx.text(s)}</p>`).join("");
  window.TEMPLATE = {
    deco(slide, ctx) {
      const color = WALLS[hash(ctx.job.slides[0].title) % WALLS.length];
      let html = `<div class="wall" style="background: radial-gradient(ellipse 90% 75% at 50% 18%, #fff 0, #fff 25%, ${color} 100%)"></div>`;
      if (["cover", "point", "quote", "closing"].includes(slide.kind)) {
        html += `<img class="cut" src="${ctx.esc(ctx.job.background)}">`;
        if (slide.kind === "cover" && slide.kicker) html += `<div class="say">${ctx.esc(slide.kicker)}</div>`;
      }
      return html;
    },
    content(slide, ctx) {
      const num = `<span class="num">${CIRCLED[ctx.i - 2] || ctx.i - 1}</span>`;
      const title = (s, tag = "h2") => (s ? `<${tag} class="title">${ctx.text(s)}</${tag}>` : "");
      switch (slide.kind) {
        case "cover":
          return title(slide.title, "h1") + (slide.subtitle || (slide.hook || []).length
            ? `<div class="box">${lines(ctx, slide.hook && slide.hook.length ? slide.hook : [slide.subtitle])}</div>` : "");
        case "point":
          return num + title(slide.title) + `<div class="box">${lines(ctx, [slide.body])}</div>`;
        case "list":
          return num + title(slide.title) + `<ul class="box">${(slide.items || []).map((it) => `<li>${ctx.text(it)}</li>`).join("")}</ul>`;
        case "compare":
          return num + title(slide.title) + `<div class="cmp">${(slide.items || []).map((it) => `<div><small>${ctx.text(it.label)}</small><b>${ctx.text(it.value)}</b></div>`).join("")}</div>` +
            (slide.note ? `<div class="box">${lines(ctx, [slide.note])}</div>` : "");
        case "stat":
          return num + `<p class="value">${ctx.text(slide.value)}</p><p class="label">${ctx.text(slide.label)}</p>` +
            (slide.note ? `<div class="box">${lines(ctx, [slide.note])}</div>` : "");
        case "quote":
          return title(slide.quote) + (slide.source ? `<div class="box"><p class="src">${ctx.text(slide.source)}</p></div>` : "");
        case "closing":
          return title(slide.title) + (slide.body ? `<div class="box">${lines(ctx, [slide.body])}</div>` : "");
      }
      return "";
    },
    foot: (slide, ctx) => `<footer class="foot"><span>${ctx.esc(ctx.brand.handle || "")}</span>
      <span class="mark">${ctx.esc(ctx.brand.wordmark || ctx.brand.name)}</span><span>${String(ctx.i).padStart(2, "0")}</span></footer>`,
  };
})();
</script>
<script src="../_shared/engine.js"></script>
</body></html>
